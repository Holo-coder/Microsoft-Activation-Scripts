name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 0 * * *" # Every 24 hours (midnight UTC)
  workflow_dispatch: # Allow manual sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync "$GITHUB_REPOSITORY" --branch master
